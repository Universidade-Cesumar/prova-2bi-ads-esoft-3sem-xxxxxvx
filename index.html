<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
        <h1>Controle de Almoxarifado</h1>
        <p class="subtitulo">Cadastro e listagem de materiais do estoque</p>
        <div class="card-form">
            <h2>Cadastrar Material</h2>
            <div class="row">
                <div class="form-group col-md-6">
                    <label for="input-nome">Nome do Material</label>
                    <input type="text" class="form-control" id="input-nome" placeholder="Ex: Seringa 10ml">
                </div>
                <div class="form-group col-md-3">
                    <label for="input-quantidade">Quantidade</label>
                    <input type="number" class="form-control" id="input-quantidade" placeholder="Ex: 50" min="0">
                </div>
                <div class="form-group col-md-3">
                    <label for="input-unidade">Unidade de Medida</label>
                    <input type="text" class="form-control" id="input-unidade" placeholder="Ex: unidade, caixa">
                </div>
            </div>
            <div class="row">
                <div class="form-group col-md-12">
                    <label for="input-observacoes">Observações</label>
                    <input type="text" class="form-control" id="input-observacoes" placeholder="Observações (opcional)">
                </div>
            </div>
            <button type="button" class="btn btn-primary" id="btn-cadastrar">Cadastrar Material</button>
        </div>
        <div class="card-form">
            <h2>Materiais em Estoque</h2>

            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Unidade</th>
                        <th>Data de Cadastro</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody id="lista-materiais">
                </tbody>
            </table>
        </div>
</div>

<script type="text/javascript" src="./main.js"></script>
</body>

</html>
